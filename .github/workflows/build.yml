
name: Build RLclient APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RLclient source
        run: |
          ZIP="RLclient-0.1.7-Criticals-DupeHub-working.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$ZIP" -d unpacked

          if [ ! -f unpacked/RLclient-source/gradlew ]; then
            echo "ERROR: Invalid source ZIP structure"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build RLclient Debug APK
        working-directory: unpacked/RLclient-source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RLclient-0.1.7-Debug-APK
          path: unpacked/RLclient-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
